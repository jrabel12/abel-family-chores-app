<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Family Chore Chart</title>
<style>
  :root{
    --bg:#EAF2F8;
    --card:#FFFFFF;
    --ink:#1F2B45;
    --ink-soft:#5B6B8C;
    --line:#DCE6F0;
    --blue:#2E6BE6;
    --blue-soft:#E3ECFF;
    --green:#2FB86B;
    --green-soft:#E1F6EA;
    --gold:#F5B301;
    --gold-soft:#FFF3D1;
    --red:#E15241;
    --radius:20px;
    --shadow:0 4px 14px rgba(31,43,69,.08);
    --font:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN",Quicksand,Nunito,-apple-system,Segoe UI,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--font);
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
    padding-bottom:96px;
    -webkit-user-select:none;user-select:none;
  }
  input,select{font-family:var(--font);-webkit-user-select:text;user-select:text}
  header{
    padding:20px 22px 10px;
    display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:12px}
  .brand .logo{
    width:48px;height:48px;border-radius:14px;background:var(--gold);
    display:flex;align-items:center;justify-content:center;font-size:26px;
    box-shadow:var(--shadow);
  }
  .brand h1{font-size:24px;margin:0;letter-spacing:.2px}
  .brand .sub{font-size:13px;color:var(--ink-soft);margin-top:2px}
  .week-label{
    background:var(--card);border:1px solid var(--line);border-radius:999px;
    padding:8px 16px;font-size:14px;font-weight:600;color:var(--ink-soft);box-shadow:var(--shadow);
  }
  main{max-width:960px;margin:0 auto;padding:8px 22px 24px}
  .kid-chips{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 18px}
  .chip{
    display:flex;align-items:center;gap:8px;
    padding:10px 18px;border-radius:999px;border:2px solid transparent;
    background:var(--card);box-shadow:var(--shadow);
    font-size:16px;font-weight:700;cursor:pointer;min-height:44px;
  }
  .chip .dot{width:14px;height:14px;border-radius:50%}
  .chip.active{border-color:var(--ink)}
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:16px}
  .card h2{margin:0 0 4px;font-size:18px}
  .muted{color:var(--ink-soft);font-size:14px}
  .empty{
    text-align:center;padding:36px 20px;color:var(--ink-soft);font-size:16px;
  }
  .empty .big{font-size:40px;margin-bottom:8px}
  .chore-row{
    display:flex;align-items:center;gap:14px;
    padding:12px 6px;border-bottom:1px solid var(--line);min-height:60px;
  }
  .chore-row:last-child{border-bottom:none}
  .checkbox{
    width:44px;height:44px;border-radius:14px;border:3px solid var(--line);
    background:#fff;display:flex;align-items:center;justify-content:center;
    font-size:24px;cursor:pointer;flex:0 0 44px;transition:transform .12s ease, background .12s ease, border-color .12s ease;
  }
  .checkbox.done{background:var(--green);border-color:var(--green);color:#fff}
  .checkbox:active{transform:scale(.9)}
  .chore-info{flex:1;min-width:0}
  .chore-title{font-size:17px;font-weight:700}
  .chore-title.done{text-decoration:line-through;color:var(--ink-soft)}
  .chore-meta{font-size:13px;color:var(--ink-soft);display:flex;align-items:center;gap:6px;margin-top:2px}
  .kid-tag{display:inline-flex;align-items:center;gap:6px;font-weight:700}
  .kid-tag .dot{width:10px;height:10px;border-radius:50%}
  .day-badge{font-size:12px;font-weight:800;color:var(--ink-soft);background:var(--bg);border-radius:8px;padding:3px 8px}
  .jars{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
  .jar-card{
    background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:16px;display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;overflow:hidden;
  }
  .ring{position:relative;width:110px;height:110px}
  .ring svg{transform:rotate(-90deg)}
  .ring .coin{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-size:15px;font-weight:800;
  }
  .ring .coin .emoji{font-size:28px;line-height:1}
  .jar-name{font-size:17px;font-weight:800}
  .jar-sub{font-size:13px;color:var(--ink-soft)}
  .paid-stamp{
    position:absolute;top:10px;right:10px;background:var(--green-soft);color:var(--green);
    font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;
  }
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .cal-title{font-size:20px;font-weight:800}
  .cal-nav{display:flex;gap:8px}
  .icon-btn{
    width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:#fff;
    font-size:20px;cursor:pointer;color:var(--ink)
  }
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .cal-dow{text-align:center;font-size:12px;font-weight:800;color:var(--ink-soft);padding:6px 0}
  .cal-cell{
    background:#fff;border:1px solid var(--line);border-radius:14px;min-height:74px;
    padding:6px;cursor:pointer;position:relative;
  }
  .cal-cell.dim{opacity:.35}
  .cal-cell.today{border:2px solid var(--blue)}
  .cal-cell .num{font-size:13px;font-weight:800}
  .cal-dots{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
  .cal-dot{width:10px;height:10px;border-radius:50%;border:2px solid transparent}
  .cal-dot.open{background:transparent!important}
  .day-sheet{margin-top:14px}
  .earn-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin-bottom:16px}
  .earn-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;position:relative;overflow:hidden}
  .earn-card .band{position:absolute;top:0;left:0;right:0;height:8px}
  .earn-amount{font-size:34px;font-weight:800;margin:6px 0 2px}
  .history-row{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);font-size:15px}
  .history-row:last-child{border-bottom:none}
  .history-amt{font-weight:800;color:var(--green)}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:640px){.form-grid{grid-template-columns:1fr}}
  label.f{display:block;font-size:13px;font-weight:800;color:var(--ink-soft);margin:10px 0 6px}
  input.f,select.f{
    width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);
    font-size:16px;background:#fff;color:var(--ink);min-height:48px;
  }
  input.f:focus,select.f:focus{outline:3px solid var(--blue-soft);border-color:var(--blue)}
  .btn{
    border:none;border-radius:14px;padding:13px 20px;font-size:16px;font-weight:800;
    cursor:pointer;min-height:48px;font-family:var(--font);
  }
  .btn.primary{background:var(--blue);color:#fff}
  .btn.green{background:var(--green);color:#fff}
  .btn.ghost{background:var(--bg);color:var(--ink)}
  .btn.danger{background:#FDECEA;color:var(--red)}
  .btn:disabled{opacity:.45;cursor:default}
  .btn:active:not(:disabled){transform:scale(.97)}
  .color-row{display:flex;gap:10px;flex-wrap:wrap}
  .swatch{width:40px;height:40px;border-radius:12px;border:3px solid transparent;cursor:pointer}
  .swatch.sel{border-color:var(--ink)}
  .day-picks{display:flex;gap:8px;flex-wrap:wrap}
  .day-pick{
    width:46px;height:46px;border-radius:14px;border:2px solid var(--line);background:#fff;
    font-weight:800;font-size:14px;cursor:pointer;color:var(--ink-soft)
  }
  .day-pick.sel{background:var(--blue);border-color:var(--blue);color:#fff}
  .emoji-row{display:flex;gap:8px;flex-wrap:wrap}
  .emoji-pick{width:46px;height:46px;border-radius:14px;border:2px solid var(--line);background:#fff;font-size:22px;cursor:pointer}
  .emoji-pick.sel{border-color:var(--blue);background:var(--blue-soft)}
  .kid-manage-row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .kid-manage-row:last-child{border-bottom:none}
  .edit-panel{
    background:var(--blue-soft);border:2px solid var(--blue);border-radius:16px;
    padding:14px 16px;margin:10px 0;
  }
  .payout-input{width:110px}
  .pay-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .pay-row:last-child{border-bottom:none}
  .gate{max-width:420px;margin:40px auto;text-align:center}
  .gate .q{font-size:26px;font-weight:800;margin:14px 0}
  .gate input{text-align:center;font-size:24px}
  nav{
    position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);
    backdrop-filter:blur(10px);border-top:1px solid var(--line);
    display:flex;justify-content:space-around;padding:8px 10px calc(10px + env(safe-area-inset-bottom));z-index:50;
  }
  .tab{
    flex:1;max-width:180px;display:flex;flex-direction:column;align-items:center;gap:2px;
    border:none;background:none;font-family:var(--font);font-size:12px;font-weight:800;
    color:var(--ink-soft);cursor:pointer;padding:6px 0;border-radius:14px;min-height:56px;
  }
  .tab .ico{font-size:24px}
  .tab.active{color:var(--blue);background:var(--blue-soft)}
  .toast{
    position:fixed;bottom:110px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:12px 22px;border-radius:999px;
    font-size:15px;font-weight:700;box-shadow:var(--shadow);z-index:99;
    opacity:0;transition:opacity .25s;pointer-events:none;
  }
  .toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">🧹</div>
    <div>
      <h1>Family Chore Chart</h1>
      <div class="sub" id="headerSub">Loading…</div>
    </div>
  </div>
  <div class="week-label" id="weekLabel"></div>
</header>
<main id="main"><div class="empty"><div class="big">⏳</div>Loading your chart…</div></main>
<nav>
  <button class="tab active" data-tab="chores"><span class="ico">✅</span>Chores</button>
  <button class="tab" data-tab="calendar"><span class="ico">📅</span>Calendar</button>
  <button class="tab" data-tab="earnings"><span class="ico">💰</span>Earnings</button>
  <button class="tab" data-tab="parents"><span class="ico">🔒</span>Parents</button>
</nav>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDniNUPKiY74_FbaIMZqdoJtwzhGs6VrZg",
  authDomain: "abel-family-chore-tracker.firebaseapp.com",
  projectId: "abel-family-chore-tracker",
  storageBucket: "abel-family-chore-tracker.firebasestorage.app",
  messagingSenderId: "934577725326",
  appId: "1:934577725326:web:77f53c2e3009328faf0edf"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database().ref('chorechart-v1');

const KID_COLORS = ['#FF6B5E','#F5A623','#2FB86B','#8B5CF6','#38BDF8','#EC4899'];
const EMOJIS = ['🧹','🛏️','🐕','🍽️','🗑️','🧺','🌱','🚿','📚','🧸','🚲','🍳'];
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DOW1 = ['S','M','T','W','T','F','S'];
const STORE_KEY = 'chorechart-v1';

let state = { kids: [], chores: [], completions: {}, payments: [] };
let ui = {
  tab: 'chores',
  kidFilter: 'all',
  calMonth: null,
  selectedDate: null,
  parentUnlocked: false,
  gateA: 0, gateB: 0,
  newKidColor: KID_COLORS[0],
  newChoreEmoji: EMOJIS[0],
  newChoreDays: new Set(),
  saveTimer: null,
  celebrated: new Set(),
  editingChore: null,
};

function loadState(){
  db.once('value').then(snapshot => {
    const data = snapshot.val();
    if (data) state = data;
    state.kids ||= []; 
    state.chores ||= []; 
    state.completions ||= {}; 
    state.payments ||= [];
    render();
  }).catch(() => render());
}

function saveState(){
  clearTimeout(ui.saveTimer);
  ui.saveTimer = setTimeout(() => {
    db.set(state).catch(e => toast('Could not save. Check your connection.'));
  }, 300);
}

const pad = n => String(n).padStart(2,'0');
const dkey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => new Date();
function weekStart(d){ const x = new Date(d); x.setDate(x.getDate()-x.getDay()); x.setHours(0,0,0,0); return x; }
function weekDates(d){ const s = weekStart(d); return Array.from({length:7},(_,i)=>{const x=new Date(s); x.setDate(s.getDate()+i); return x;}); }
function fmtShort(d){ return d.toLocaleDateString(undefined,{month:'short',day:'numeric'}); }
function money(n){ return '$'+ (Math.round(n*100)/100).toFixed(2); }
const uid = () => Math.random().toString(36).slice(2,10);

const kidById = id => state.kids.find(k=>k.id===id);
function choresFor(kidId, dow){ return state.chores.filter(c => c.kidId===kidId && c.days.includes(dow)); }
function isDone(choreId, dateKey){ return !!(state.completions[dateKey] && state.completions[dateKey][choreId]); }
function toggleDone(choreId, dateKey){
  state.completions[dateKey] ||= {};
  if(state.completions[dateKey][choreId]) delete state.completions[dateKey][choreId];
  else state.completions[dateKey][choreId] = true;
  saveState();
}
function weekProgress(kidId, refDate){
  const dates = weekDates(refDate);
  let total = 0, done = 0;
  dates.forEach(d=>{
    choresFor(kidId, d.getDay()).forEach(c=>{
      total++;
      if(isDone(c.id, dkey(d))) done++;
    });
  });
  return {total, done, pct: total ? done/total : 0};
}
function weekKeyOf(d){ return dkey(weekStart(d)); }
function alreadyPaid(kidId, wk){ return state.payments.some(p=>p.kidId===kidId && p.weekKey===wk); }
function lifetime(kidId){ return state.payments.filter(p=>p.kidId===kidId).reduce((s,p)=>s+p.amount,0); }

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}
function confetti(el, color){
  for(let i=0;i<14;i++){
    const p = document.createElement('div');
    p.className='confetti-piece';
    p.style.left = (5+Math.random()*90)+'%';
    p.style.background = i%3===0 ? 'var(--gold)' : color;
    p.style.animationDelay = (Math.random()*0.3)+'s';
    el.appendChild(p);
    setTimeout(()=>p.remove(),1600);
  }
}

function render(){
  document.getElementById('weekLabel').textContent = 'Week of ' + fmtShort(weekStart(today()));
  document.getElementById('headerSub').textContent = state.kids.length ? state.kids.map(k=>k.name).join(' • ') : 'Add your kids in the Parents tab';
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active', b.dataset.tab===ui.tab));
  const main = document.getElementById('main');
  main.innerHTML = '';
  if(ui.tab==='chores') renderChores(main);
  else if(ui.tab==='calendar') renderCalendar(main);
  else if(ui.tab==='earnings') renderEarnings(main);
  else renderParents(main);
}

function kidChips(container, includeAll){
  const wrap = document.createElement('div'); wrap.className='kid-chips';
  const mk = (id,label,color)=>{
    const b = document.createElement('button'); b.className='chip'+(ui.kidFilter===id?' active':'');
    b.innerHTML = (color?`<span class="dot" style="background:${color}"></span>`:'👨‍👩‍👧‍👦 ') + label;
    b.onclick = ()=>{ ui.kidFilter = id; render(); };
    wrap.appendChild(b);
  };
  if(includeAll) mk('all','Everyone',null);
  state.kids.forEach(k=>mk(k.id,k.name,k.color));
  container.appendChild(wrap);
}

function choreRow(chore, dateKey, dayLabel){
  const kid = kidById(chore.kidId);
  const done = isDone(chore.id, dateKey);
  const row = document.createElement('div'); row.className='chore-row';
  row.innerHTML = `
    <div class="checkbox ${done?'done':''}" role="checkbox" aria-checked="${done}" tabindex="0">${done?'✓':''}</div>
    <div class="chore-info">
      <div class="chore-title ${done?'done':''}">${chore.emoji||'🧹'} ${chore.title}</div>
      <div class="chore-meta">
        <span class="kid-tag"><span class="dot" style="background:${kid?kid.color:'#999'}"></span>${kid?kid.name:'—'}</span>
        ${dayLabel?`<span class="day-badge">${dayLabel}</span>`:''}
      </div>
    </div>`;
  const box = row.querySelector('.checkbox');
  const act = ()=>{
    toggleDone(chore.id, dateKey);
    const nowDone = isDone(chore.id, dateKey);
    if(nowDone && kid){
      const prog = weekProgress(kid.id, new Date(dateKey+'T12:00'));
      if(prog.total>0 && prog.done===prog.total) toast(`🎉 ${kid.name} finished the whole list!`);
    }
    render();
  };
  box.onclick = act;
  box.onkeydown = e=>{ if(e.key===' '||e.key==='Enter'){e.preventDefault();act();} };
  return row;
}

function renderChores(main){
  if(!state.kids.length){
    main.innerHTML = `<div class="card empty"><div class="big">👋</div>Welcome! Head to the <b>Parents</b> tab to add your kids and their first chores.</div>`;
    return;
  }
  kidChips(main,true);
  const jars = document.createElement('div'); jars.className='jars';
  const shown = ui.kidFilter==='all' ? state.kids : state.kids.filter(k=>k.id===ui.kidFilter);
  shown.forEach(k=>{
    const p = weekProgress(k.id, today());
    const wk = weekKeyOf(today());
    const paid = alreadyPaid(k.id, wk);
    const R=46, C=2*Math.PI*R;
    const card = document.createElement('div'); card.className='jar-card';
    card.innerHTML = `
      ${paid?'<div class="paid-stamp">PAID ✓</div>':''}
      <div class="ring">
        <svg width="110" height="110">
          <circle cx="55" cy="55" r="${R}" fill="none" stroke="var(--line)" stroke-width="10"/>
          <circle cx="55" cy="55" r="${R}" fill="none" stroke="${k.color}" stroke-width="10"
            stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p.pct)}"/>
        </svg>
        <div class="coin"><span class="emoji">${p.pct>=1?'🪙':'🐷'}</span>${Math.round(p.pct*100)}%</div>
      </div>
      <div class="jar-name">${k.name}</div>
      <div class="jar-sub">${p.done} of ${p.total} chores • earns ${money(k.payout||0)}</div>`;
    const celebKey = k.id + '|' + wk;
    if(p.total>0 && p.done===p.total && !ui.celebrated.has(celebKey)){
      ui.celebrated.add(celebKey);
      confetti(card, k.color);
    }
    jars.appendChild(card);
  });
  main.appendChild(jars);
  const tKey = dkey(today());
  const todayCard = document.createElement('div'); todayCard.className='card'; todayCard.style.marginTop='16px';
  todayCard.innerHTML = `<h2>Today • ${DOW[today().getDay()]} ${fmtShort(today())}</h2>`;
  const tChores = state.chores.filter(c => c.days.includes(today().getDay()) && (ui.kidFilter==='all' || c.kidId===ui.kidFilter));
  if(!tChores.length) todayCard.innerHTML += `<div class="empty" style="padding:20px">🌴 No chores today. Nice!</div>`;
  else tChores.forEach(c=>todayCard.appendChild(choreRow(c, tKey)));
  main.appendChild(todayCard);
  const weekCard = document.createElement('div'); weekCard.className='card';
  weekCard.innerHTML = `<h2>This week</h2><div class="muted" style="margin-bottom:6px">Finish everything to earn your payout.</div>`;
  let any=false;
  weekDates(today()).forEach(d=>{
    if(dkey(d)===tKey) return;
    const list = state.chores.filter(c => c.days.includes(d.getDay()) && (ui.kidFilter==='all' || c.kidId===ui.kidFilter));
    list.forEach(c=>{ any=true; weekCard.appendChild(choreRow(c, dkey(d), DOW[d.getDay()]+' '+fmtShort(d))); });
  });
  if(!any) weekCard.innerHTML += `<div class="empty" style="padding:20px">Nothing else scheduled this week.</div>`;
  main.appendChild(weekCard);
}

function renderCalendar(main){ /* full original function */ }
function renderEarnings(main){ /* full original function */ }
function renderParents(main){ /* full original function */ }

document.querySelectorAll('.tab').forEach(b=>{
  b.onclick = ()=>{ ui.tab = b.dataset.tab; ui.selectedDate=null; render(); };
});

loadState();
</script>
</body>
</html>
